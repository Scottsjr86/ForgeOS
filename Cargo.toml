[workspace]
members = [
    "crates/forge-app",
    "crates/forge-bridge",
    "crates/forge-core",
    "crates/forge-editor",
    "crates/forge-git",
    "crates/forge-guards",
    "crates/forge-nyx-client",
    "crates/forge-project",
    "crates/forge-protocol",
    "crates/forge-session",
    "crates/forge-terminal",
    "crates/forge-world",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
